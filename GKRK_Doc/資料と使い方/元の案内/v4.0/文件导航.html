：制作進行、職種窓口、判断担当", "timing": "依頼、確認、阻害、判断変更の発生時", "purpose": "運用案・未承認。相手が次の作業を選べる連絡を作り、返信や担当が途切れた場合の対応を定める。連絡実績の正本は連絡レビュー記録台帳とする。", "notes": "连络手顺定义方法，外部連絡記録書保留一次外联详情，連絡レビュー記録台帳保存索引与问询关系；不将草稿记录当作实际发送。", "href": "../../../%E8%A8%98%E9%8C%B2/%E4%BC%9A%E8%AD%B0%E3%81%A8%E9%80%A3%E7%B5%A1/%E9%80%A3%E7%B5%A1%E3%81%A8%E3%82%A8%E3%82%B9%E3%82%AB%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "キックオフ準備進行手順書", "file": "../../../記録/会議と連絡/キックオフ準備進行手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：制作進行、会議進行、各職種窓口", "timing": "制作キックオフ前、対象範囲や体制を大きく組み直す前", "purpose": "運用案・未承認。チーム立上げ実施計画書で立ち上げた体制を前提に、制作キックオフの資料、議題、進行と後続確認を準備する。議事の正本は会議議事録とする。", "notes": "团队建立计划覆盖整体启动，キックオフ準備進行手順書只说明启动会议；实际建立与参与记录在チーム立上げ参加管理台帳，不重复记作已完成。", "href": "../../../%E8%A8%98%E9%8C%B2/%E4%BC%9A%E8%AD%B0%E3%81%A8%E9%80%A3%E7%B5%A1/%E3%82%AD%E3%83%83%E3%82%AF%E3%82%AA%E3%83%95%E6%BA%96%E5%82%99%E9%80%B2%E8%A1%8C%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "会議準備進行手順書", "file": "../../../記録/会議と連絡/会議準備進行手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：会議進行、制作進行、記録担当", "timing": "定例会、課題相談、判断会議の準備と開催時", "purpose": "運用案・未承認。会議の目的と入力を揃え、決定や宿題を正本へ接続する。通常会議の議事は会議議事録、意思決定の本文は意思決定記録に保存する。", "notes": "各手顺说明准备方法，制作準備確認台帳记录当次具体检查；已记录的准备结果以证据和对象位置引用，不在每份手顺中另建状态表。", "href": "../../../%E8%A8%98%E9%8C%B2/%E4%BC%9A%E8%AD%B0%E3%81%A8%E9%80%A3%E7%B5%A1/%E4%BC%9A%E8%AD%B0%E6%BA%96%E5%82%99%E9%80%B2%E8%A1%8C%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "制作着手前確認書", "file": "../../../制作管理/着手準備/制作着手前確認書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：依頼元、制作担当、受入担当、制作進行", "timing": "新しい制作作業の着手前、前提版や依存を変更した後", "purpose": "記入用確認書。確認方法は運用案・未承認。TSKごとに入力、環境、制約と受入条件を照合し、着手可否の根拠を残す。進捗の正本は制作計画進捗台帳とする。", "notes": "制作着手前确认的逐项检查在制作準備確認台帳记录；需要说明综合判断或特殊条件时使用制作着手前確認書，不再维护第二套检查状态。", "href": "../../../%E5%88%B6%E4%BD%9C%E7%AE%A1%E7%90%86/%E7%9D%80%E6%89%8B%E6%BA%96%E5%82%99/%E5%88%B6%E4%BD%9C%E7%9D%80%E6%89%8B%E5%89%8D%E7%A2%BA%E8%AA%8D%E6%9B%B8.docx"}, {"title": "レビュー準備指摘取扱手順書", "file": "../../../記録/会議と連絡/レビュー準備指摘取扱手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：提出者、レビュー進行、確認担当、制作進行", "timing": "企画、仕様、素材、実装や段階レビューの前後", "purpose": "運用案・未承認。対象版と判断基準を揃え、指摘を確認可能な修正へ変換する。企画は企画レビュー記録、コードはコードレビュー記録、段階判定はマイルストーン審査記録を根拠本文の正本とする。", "notes": "各手顺说明准备方法，制作準備確認台帳记录当次具体检查；已记录的准备结果以证据和对象位置引用，不在每份手顺中另建状态表。；企划、规格、代码评审保留各自专业正文，原指摘只建立一次并引用；連絡レビュー記録台帳作为指摘索引，不重复维护指摘解消状态。", "href": "../../../%E8%A8%98%E9%8C%B2/%E4%BC%9A%E8%AD%B0%E3%81%A8%E9%80%A3%E7%B5%A1/%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%E6%BA%96%E5%82%99%E6%8C%87%E6%91%98%E5%8F%96%E6%89%B1%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "外部連絡記録書", "file": "../../../記録/会議と連絡/外部連絡記録書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：対外窓口、制作進行、文面確認担当", "timing": "学外関係先への問い合わせや外部制作の連絡が必要な場合", "purpose": "記入用記録書。準備と確認の説明は運用案・未承認。本テンプレートの作成は実際の送信を行う指示ではない。外部連絡の索引と現在状態は連絡レビュー記録台帳を正本とする。", "notes": "连络手顺定义方法，外部連絡記録書保留一次外联详情，連絡レビュー記録台帳保存索引与问询关系；不将草稿记录当作实际发送。", "href": "../../../%E8%A8%98%E9%8C%B2/%E4%BC%9A%E8%AD%B0%E3%81%A8%E9%80%A3%E7%B5%A1/%E5%A4%96%E9%83%A8%E9%80%A3%E7%B5%A1%E8%A8%98%E9%8C%B2%E6%9B%B8.docx"}, {"title": "プレイテスト受入準備説明書", "file": "../../../品質とテスト/プレイテスト/プレイテスト受入準備説明書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：プレイテスト進行、観察、端末準備、企画", "timing": "計画したプレイテストの受入前と実施当日", "purpose": "運用案・未承認。プロトタイプ検証計画書とテスト計画書の検証計画を、参加者の説明、端末準備、観察と記録へ接続する。結果はテスト不具合管理台帳とプレイテスト報告書を正本とし、準備は制作準備確認台帳に記録する。", "notes": "各手顺说明准备方法，制作準備確認台帳记录当次具体检查；已记录的准备结果以证据和对象位置引用，不在每份手顺中另建状态表。", "href": "../../../%E5%93%81%E8%B3%AA%E3%81%A8%E3%83%86%E3%82%B9%E3%83%88/%E3%83%97%E3%83%AC%E3%82%A4%E3%83%86%E3%82%B9%E3%83%88/%E3%83%97%E3%83%AC%E3%82%A4%E3%83%86%E3%82%B9%E3%83%88%E5%8F%97%E5%85%A5%E6%BA%96%E5%82%99%E8%AA%AC%E6%98%8E%E6%9B%B8.docx"}, {"title": "測定データ取得準備手順書", "file": "../../../品質とテスト/計画と準備/測定データ取得準備手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：測定設計、計測実施、データ確認、企画または技術", "timing": "レベル・操作・性能等の数値測定とデータ取得の前", "purpose": "運用案・未承認。測定対象、単位、開始終了条件と保存を揃え、取得した値を再確認可能にする。テスト結果はテスト不具合管理台帳、解釈はレベル設計書または技術検証報告書等へ接続する。", "notes": "各手顺说明准备方法，制作準備確認台帳记录当次具体检查；已记录的准备结果以证据和对象位置引用，不在每份手顺中另建状态表。", "href": "../../../%E5%93%81%E8%B3%AA%E3%81%A8%E3%83%86%E3%82%B9%E3%83%88/%E8%A8%88%E7%94%BB%E3%81%A8%E6%BA%96%E5%82%99/%E6%B8%AC%E5%AE%9A%E3%83%87%E3%83%BC%E3%82%BF%E5%8F%96%E5%BE%97%E6%BA%96%E5%82%99%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "職種連携制作演習手順書", "file": "../../../制作管理/チーム立上げ/職種連携制作演習手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：演習進行、企画、美術、プログラム、テスト", "timing": "職種間の制作手順を試す時、受渡方法を改める前", "purpose": "運用案・未承認。小さな演習でREQからSPEC、AST、BLD、TSTと報告までの対応を試す。入隊、アカウント、役割や規程の教育は入隊教育と実習確認手順書に従う。", "notes": "参加教育与职种制作演练可以连接，但不重复开展同一教育或计算同一实际工时；教育实施记录在チーム立上げ参加管理台帳索引。", "href": "../../../%E5%88%B6%E4%BD%9C%E7%AE%A1%E7%90%86/%E3%83%81%E3%83%BC%E3%83%A0%E7%AB%8B%E4%B8%8A%E3%81%92/%E8%81%B7%E7%A8%AE%E9%80%A3%E6%90%BA%E5%88%B6%E4%BD%9C%E6%BC%94%E7%BF%92%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "作業休止再開手順書", "file": "../../../記録/引継と保管/作業休止再開手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：制作進行、職種窓口、技術、復旧確認", "timing": "共有環境の停止、制作の休止、再開条件の確認時", "purpose": "運用案・未承認。制作作業を止める範囲、保存、代替作業と再開条件を定める。障害の詳細は障害報告書、通常の保管はアーカイブ管理手順書、連絡は連絡とエスカレーション手順書を参照する。", "notes": "成员暂离、作业休止与具体引继不是同一事件；涉及同一事件时共享一次引继事实和未解决事项，通过完整名称引用补充各自条件。", "href": "../../../%E8%A8%98%E9%8C%B2/%E5%BC%95%E7%B6%99%E3%81%A8%E4%BF%9D%E7%AE%A1/%E4%BD%9C%E6%A5%AD%E4%BC%91%E6%AD%A2%E5%86%8D%E9%96%8B%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"title": "職種間受渡運用手順書", "file": "../../../記録/引継と保管/職種間受渡運用手順書.docx", "category": "策划管理用类", "format": "Word", "owner": "担当候補：制作進行、企画、美術、プログラム、テスト", "timing": "職種間の制作物受渡、担当境界の確認、仕様変更時", "purpose": "運用案・未承認。職種間で何を渡し、誰が何を確認するかを実行手順にする。担当交代の本文は引継書、素材形式の正本はアセット受渡仕様書、状態は対応する横断管理台帳に置く。", "notes": "职种共通受渡流程、素材交付条件、资源批次证据和单项受领票各有范围；同一交接的实际提交物与受领证据保存一处，其余按完整名称引用。", "href": "../../../%E8%A8%98%E9%8C%B2/%E5%BC%95%E7%B6%99%E3%81%A8%E4%BF%9D%E7%AE%A1/%E8%81%B7%E7%A8%AE%E9%96%93%E5%8F%97%E6%B8%A1%E9%81%8B%E7%94%A8%E6%89%8B%E9%A0%86%E6%9B%B8.docx"}, {"ti
